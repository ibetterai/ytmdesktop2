name: Arm auto-merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

# Security: pull_request_target has a write-capable token. This workflow must remain
# metadata-only — never check out or execute pull-request code here.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: arm-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already armed."
            exit 0
          fi
          gh pr merge "$PR_URL" --auto --squash
