name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # @venipa/xosms (+ platform optional deps) on GitHub Packages
  checks: write
  pull-requests: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24.14.0
          cache: true
          install: false

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run vitest
        run: pnpm test

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  tauri-feasibility:
    name: Tauri feasibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Validate Tauri source configuration
        run: node --test apps/ytmdesktop2/src-tauri/tests/source-config.test.mjs

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Compile Tauri feasibility seam
        run: cargo fmt --manifest-path apps/ytmdesktop2/src-tauri/Cargo.toml -- --check && cargo test --locked --manifest-path apps/ytmdesktop2/src-tauri/Cargo.toml
